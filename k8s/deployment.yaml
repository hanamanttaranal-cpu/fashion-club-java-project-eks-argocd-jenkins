apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-club-backend
  namespace: fashion-club
  labels:
    app: fashion-club-backend
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fashion-club-backend
  template:
    metadata:
      labels:
        app: fashion-club-backend
    spec:
      containers:
        - name: backend
          image: IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fashion-club-config
            - secretRef:
                name: fashion-club-secrets
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/actuator/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fashion-club-frontend
  namespace: fashion-club
  labels:
    app: fashion-club-frontend
    tier: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fashion-club-frontend
  template:
    metadata:
      labels:
        app: fashion-club-frontend
    spec:
      containers:
        - name: frontend
          image: IMAGE_TAG_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: fashion-club-config
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-db
  namespace: fashion-club
  labels:
    app: mysql-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-db
  template:
    metadata:
      labels:
        app: mysql-db
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: fashion-club-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: fashion-club-secrets
                  key: DB_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fashion-club-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              value: "root_dummy_secure_pass_123"
