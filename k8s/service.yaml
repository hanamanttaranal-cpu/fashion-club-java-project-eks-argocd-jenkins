apiVersion: v1
kind: Service
metadata:
  name: fashion-club-backend-service
  namespace: fashion-club
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: fashion-club-backend
---
apiVersion: v1
kind: Service
metadata:
  name: fashion-club-frontend-service
  namespace: fashion-club
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: fashion-club-frontend
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-service
  namespace: fashion-club
spec:
  type: ClusterIP
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
  selector:
    app: mysql-db
