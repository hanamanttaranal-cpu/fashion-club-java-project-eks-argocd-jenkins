version: '3.8'

services:
  # ---------------------------------------------------
  # 1. Frontend Web App Service (React + Tailwind)
  # ---------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: atelier_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - VITE_API_URL=http://localhost:8080/api
    restart: always
    networks:
      - atelier-network

  # ---------------------------------------------------
  # 2. Backend Service (Java Spring Boot REST API)
  # ---------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: atelier_backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=atelier_fashion_db
      - DB_USER=atelier_admin
      - DB_PASSWORD=atelier_secure_pass
      - ADMIN_EMAIL=hanamanttaranal19@gmail.com
      - ADMIN_PASSWORD=12345
    depends_on:
      - postgres
    restart: always
    networks:
      - atelier-network

  # ---------------------------------------------------
  # 3. Database Service (PostgreSQL)
  # ---------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: atelier_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=atelier_fashion_db
      - POSTGRES_USER=atelier_admin
      - POSTGRES_PASSWORD=atelier_secure_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    networks:
      - atelier-network

networks:
  atelier-network:
    driver: bridge

volumes:
  postgres_data:
